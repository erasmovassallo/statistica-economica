name: Pubblica il sito su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le librerie Python
        run: pip install -r requirements.txt

      - name: Installa R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Installa i pacchetti R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::reticulate
            any::tseries
            any::lpSolve
            any::fGarch

      - name: Genera il sito (esegue il codice R e Python)
        run: quarto render
        env:
          RETICULATE_PYTHON: ${{ env.pythonLocation }}/bin/python

      - name: Pubblica sul branch gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
